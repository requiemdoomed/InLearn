name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and test (JDK 25, MySQL 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: inlearn_test
          MYSQL_USER: inlearn_test
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit and JDBC integration tests
        env:
          INLEARN_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/inlearn_test?allowPublicKeyRetrieval=true&sslMode=PREFERRED
          INLEARN_TEST_DB_USERNAME: inlearn_test
          INLEARN_TEST_DB_PASSWORD: ci-test-password
        run: mvn -B -ntp verify

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: inlearn-linux-jar
          path: target/inlearn-*-all.jar
          if-no-files-found: error
