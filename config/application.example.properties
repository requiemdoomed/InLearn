# ---------------------------------------------------------------------------
# InLearn configuration
#
# Copy this file to config/application.properties and fill in real values.
# config/application.properties is ignored by Git so passwords are never committed.
#
# The application looks for its configuration in this order:
#   1. the path given with -Dinlearn.config=/path/to/file.properties
#   2. the path in the INLEARN_CONFIG environment variable
#   3. config/application.properties in the current working directory
#
# Any database setting can also be supplied through environment variables, which
# take priority over this file: INLEARN_DB_URL, INLEARN_DB_USERNAME, INLEARN_DB_PASSWORD.
# ---------------------------------------------------------------------------

# --- Database ---------------------------------------------------------------
# MySQL 8.4 LTS (also tested with 8.0). sslMode=PREFERRED uses TLS when the server offers it.
# allowPublicKeyRetrieval=true is only needed for local servers without TLS that use
# caching_sha2_password; remove it when connecting to a remote server.
db.url=jdbc:mysql://localhost:3306/inlearn?sslMode=PREFERRED&allowPublicKeyRetrieval=true
db.username=inlearn_app
db.password=CHANGE_ME

# Seconds to wait when opening a database connection before showing an error.
db.connectTimeoutSeconds=8

# --- File storage -----------------------------------------------------------
# Uploaded course materials and assignment submissions are copied here.
# Every desktop installation that shares the same database must point to the
# same storage location (for example a shared network drive).
storage.directory=./inlearn-data/storage

# Largest file a user can upload, in megabytes.
storage.maxUploadMegabytes=25

# Comma-separated list of permitted file extensions (lowercase, without dots).
storage.allowedExtensions=pdf,doc,docx,odt,rtf,txt,md,ppt,pptx,odp,xls,xlsx,ods,csv,zip,png,jpg,jpeg,gif,java,py,c,cpp,h,js,html,css,sql,json,xml

# --- Application -----------------------------------------------------------
# "development" or "production". The demo data seeder refuses to run in production.
app.environment=development

# Time zone used to display and enter deadlines. Leave blank to use the
# computer's time zone. Example: America/Toronto
app.timezone=

# Where log files are written.
logging.directory=./inlearn-data/logs
